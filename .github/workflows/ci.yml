name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  security:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6.2.0
        with:
          python-version: 3.12

      - name: Install bandit
        run: pip install bandit

      - name: Run bandit
        run: bandit -r custom_news_feed/
